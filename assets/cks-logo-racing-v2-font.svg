<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 172" role="img" aria-label="CKS racing-cut logo v2 font-based">
  <title>CKS — Car Key System (racing-cut v2 font)</title>
  <desc>Variante font-based con racing italic. Usa Anton/Bowlby One/Arial Black con stack fallback. Italic angle 18deg + skewX para racing-cut. Letras pegadas con letter-spacing negativo.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .cks-racing {
        font-family: 'Anton', 'Bowlby One', 'Paytone One', 'Arial Black', 'Helvetica Neue', sans-serif;
        font-weight: 900;
        font-style: italic;
        font-stretch: condensed;
        letter-spacing: -6px;
        fill: #c5020e;
        paint-order: stroke fill;
      }
      .cks-racing-stripe {
        fill: #c5020e;
      }
    ]]></style>
  </defs>

  <!-- Main letterforms with skewX for stronger racing italic -->
  <g transform="skewX(-12)">
    <text x="120" y="125" class="cks-racing" font-size="135" text-anchor="start">CKS</text>
  </g>

  <!-- Racing accent stripes (bottom + top corner) -->
  <rect x="38" y="148" width="320" height="6" class="cks-racing-stripe"/>
  <rect x="38" y="14" width="80" height="3" class="cks-racing-stripe"/>
</svg>
