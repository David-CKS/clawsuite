<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Car Key System logo (racing-cut v2)">
  <title>CKS</title>
  <desc>24x24 mark variante racing-cut v2. Rojo brand sobre fondo blanco con esquina diagonal racing-cut.</desc>

  <!-- Racing card: rounded rect with diagonal cut top-right -->
  <path
    d="M 3 3
       L 19 3
       L 21 5
       L 21 19
       Q 21 21 19 21
       L 5 21
       Q 3 21 3 19
       Z"
    fill="#c5020e"/>

  <!-- CKS letters italic racing -->
  <text
    x="12"
    y="16.8"
    text-anchor="middle"
    font-family="'Anton', 'Bowlby One', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="10"
    font-style="italic"
    fill="#ffffff"
    letter-spacing="-0.5"
    transform="skewX(-8) translate(1.5,0)">CKS</text>

  <!-- Bottom racing stripe -->
  <rect x="3" y="20" width="18" height="1" fill="#ffffff" opacity="0.4"/>
</svg>
